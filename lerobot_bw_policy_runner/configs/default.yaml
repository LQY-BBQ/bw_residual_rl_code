# BW policy runner configuration.
# Final control topics stay unchanged. Debug topics are for data collection only.

ros:
  domain_id: 0

robot:
  robot_sn: BW_IZN3E0FU

  input_topics:
    state: /{robot_sn}/joint_states_fdb
    control_source: /{robot_sn}/Teleop/control_source
    cameras:
      env_cam: /camera/env_d435/color/image_raw
      left_wrist_cam: /camera/left_d405/color/image_raw
      right_wrist_cam: /camera/right_d405/color/image_raw

  output_topics:
    arm_action: /{robot_sn}/Policy/joint_angle_solution/smooth
    gripper_action: /{robot_sn}/Policy/gripper_pos
    debug_action_act: /{robot_sn}/Policy/debug/action_act
    debug_action_rl_delta: /{robot_sn}/Policy/debug/action_rl_delta
    debug_action_composed: /{robot_sn}/Policy/debug/action_composed
    debug_action_final: /{robot_sn}/Policy/debug/action_final
    debug_gripper_residual_class: /{robot_sn}/Policy/debug/gripper_residual_class

inference:
  mode: act
  policy_path: null
  device: cuda
  use_amp: false
  fps: 30.0
  task: ""
  robot_type: bw_runtime
  warmup_timeout_s: 10.0
  require_all_cameras: true
  dry_run: false
  reset_policy_on_start: true
  log_every_n_steps: 30
  log_dir: null
  arm_velocity_limit: null
  gripper_name_style: joint

  gripper:
    open_value: 0.0
    close_value: 0.8
    # Require a stable ACT open/close request instead of switching on one noisy frame.
    act_confirm_frames: 3
    residual_confidence_threshold: 0.70
    residual_confirm_frames: 3
    min_hold_s: 0.30
    hysteresis:
      enabled: true
      open_threshold: 0.50
      close_threshold: 0.40
      single_threshold: 0.45

  # Current mantis_camera_ros contract. Every inference step consumes a unique
  # frame from all three 30 FPS streams; the runner converts sources to RGB.
  camera_stream:
    sources:
      env_cam: {width: 640, height: 480, encoding: rgb8}
      left_wrist_cam: {width: 480, height: 270, encoding: rgb8}
      right_wrist_cam: {width: 480, height: 270, encoding: rgb8}
    expected_fps: 30.0
    minimum_fps: 28.5
    rate_measurement_s: 2.0
    max_frame_age_s: 0.15
    require_new_frames: true

  residual:
    policy_path: null
    # null means: use residual_lambda saved in the residual checkpoint.
    lambda: null
    deterministic: true
    # residual_limits are always loaded from the residual checkpoint.


  smoothing:
    enabled: true
    alpha: 0.35
    max_delta: 0.03

  clamp:
    enabled: false
    min: null
    max: null
