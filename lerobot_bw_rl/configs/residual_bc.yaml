# Documentation-only example. CLI arguments remain the authoritative interface.
dataset_root: ~/robot_datasets/bw_rl_corrections/rl_correction_001
repo_id: local/rl_correction_001
act_policy_path: ~/outputs/train/act_pick_block_gen3/checkpoints/last/pretrained_model
output_dir: ~/outputs/train/residual_bc_pick_block
steps: 20000
batch_size: 256
hidden_dims: [256, 256]
intervention_ratio: 0.5
intervention_loss_weight: 3.0
residual_lambda: 0.2
residual_limit_default: 0.03
gripper_hysteresis: true
gripper_open_threshold: 0.50
gripper_single_threshold: 0.45
gripper_close_threshold: 0.40
gripper_act_confirm_frames: 3
gripper_min_events: 20
gripper_loss_weight: 1.0
visual_feature_mode: cache
# Dataset and ACT camera shapes must exactly match the third-generation contract.
# No image resizing is performed while building frozen ACT features.
